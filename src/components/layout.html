<!doctype html>
<html lang="en" data-theme="dark" data-base="{{basePath}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generator" content="Guchho" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('addonova-docs-theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    {{meta}}
    <link rel="icon" href="{{rootPrefix}}public/favicon.svg" type="image/svg+xml" />
    {{seo}}
    <link rel="stylesheet" href="{{rootPrefix}}src/styles/global.css" />
    <link rel="stylesheet" href="{{rootPrefix}}src/styles/docs.css" />
    {{headExtra}}
  </head>
  <body class="{{pageClass}}">
    {{header}}
    <div class="page">
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" aria-label="Documentation">
          <a class="sidebar-logo" href="{{homeUrl}}">Addonova</a>
          {{sidebar}}
        </nav>
      </aside>
      <button class="sidebar-backdrop" data-close-sidebar aria-label="Close navigation"></button>
      <main class="content" id="main">
        {{body}}
      </main>
      <aside class="toc" id="toc" aria-label="On this page">
        {{toc}}
      </aside>
    </div>
    {{footer}}
    <script type="module" src="{{rootPrefix}}src/main.js"></script>
  </body>
</html>
